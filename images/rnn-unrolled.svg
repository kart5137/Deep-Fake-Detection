<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>RNN unrolled over time</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="300" rx="14" fill="#ffffff"/>

  <!-- Rolled form -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M80,236 V178" marker-end="url(#a)"/>
    <path d="M80,122 V64" marker-end="url(#a)"/>
    <!-- self loop -->
    <path d="M122,140 C170,140 170,96 128,96 C112,96 106,104 104,118" marker-end="url(#a)"/>
  </g>
  <rect x="40" y="122" width="80" height="56" rx="10" fill="#14b8a6" stroke="#0f766e" stroke-width="1.5"/>
  <text x="80" y="156" font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">RNN</text>

  <!-- equals -->
  <text x="200" y="160" font-size="30" font-weight="300" text-anchor="middle" fill="#64748b">=</text>

  <!-- Unrolled cells -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <!-- inputs -->
    <path d="M290,236 V178" marker-end="url(#a)"/>
    <path d="M440,236 V178" marker-end="url(#a)"/>
    <path d="M660,236 V178" marker-end="url(#a)"/>
    <!-- outputs -->
    <path d="M290,122 V64" marker-end="url(#a)"/>
    <path d="M440,122 V64" marker-end="url(#a)"/>
    <path d="M660,122 V64" marker-end="url(#a)"/>
    <!-- hidden state passed forward -->
    <path d="M330,150 H394" marker-end="url(#a)"/>
    <path d="M480,150 H530"/>
    <path d="M574,150 H614" marker-end="url(#a)"/>
  </g>
  <g fill="#14b8a6" stroke="#0f766e" stroke-width="1.5">
    <rect x="250" y="122" width="80" height="56" rx="10"/>
    <rect x="400" y="122" width="80" height="56" rx="10"/>
    <rect x="620" y="122" width="80" height="56" rx="10"/>
  </g>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#0f172a">
    <text x="290" y="156">RNN</text>
    <text x="440" y="156">RNN</text>
    <text x="660" y="156">RNN</text>
  </g>
  <text x="552" y="155" font-size="20" font-weight="700" text-anchor="middle" fill="#64748b">…</text>

  <!-- hidden-state labels -->
  <g font-size="13" font-weight="600" fill="#be185d" text-anchor="middle">
    <text x="362" y="140">h₁</text>
    <text x="596" y="140">hₜ₋₁</text>
    <text x="138" y="88">hₜ₋₁</text>
  </g>

  <!-- inputs / outputs labels -->
  <g font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="80" y="54">hₜ</text>
    <text x="80" y="256">xₜ</text>
    <text x="290" y="54">h₁</text>
    <text x="440" y="54">h₂</text>
    <text x="660" y="54">hₜ</text>
    <text x="290" y="256">x₁</text>
    <text x="440" y="256">x₂</text>
    <text x="660" y="256">xₜ</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="290" y="274">frame 1</text>
    <text x="440" y="274">frame 2</text>
    <text x="660" y="274">frame t</text>
    <text x="475" y="30">The same cell (same weights) runs at every time step, carrying its hidden state forward.</text>
  </g>
</svg>
