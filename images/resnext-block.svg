<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>ResNeXt block</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="470" rx="14" fill="#ffffff"/>

  <!-- Input -->
  <rect x="300" y="20" width="160" height="34" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="42" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">input · 256 channels</text>

  <!-- Split lines -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M380,54 V74"/>
    <path d="M160,74 H520"/>
    <path d="M160,74 V96" marker-end="url(#a)"/>
    <path d="M290,74 V96" marker-end="url(#a)"/>
    <path d="M520,74 V96" marker-end="url(#a)"/>
    <!-- within paths -->
    <path d="M160,126 V146" marker-end="url(#a)"/>
    <path d="M160,176 V196" marker-end="url(#a)"/>
    <path d="M290,126 V146" marker-end="url(#a)"/>
    <path d="M290,176 V196" marker-end="url(#a)"/>
    <path d="M520,126 V146" marker-end="url(#a)"/>
    <path d="M520,176 V196" marker-end="url(#a)"/>
    <!-- merge -->
    <path d="M160,226 V262 H366" marker-end="url(#a)"/>
    <path d="M290,226 V262"/>
    <path d="M520,226 V262 H394" marker-end="url(#a)"/>
    <!-- shortcut -->
    <path d="M460,37 H680 V340 H410" marker-end="url(#a)"/>
    <!-- after aggregation -->
    <path d="M380,276 V326" marker-end="url(#a)"/>
    <path d="M380,354 V392" marker-end="url(#a)"/>
  </g>

  <!-- Path layers: 1x1 reduce, 3x3, 1x1 expand -->
  <g font-size="12" font-weight="600" text-anchor="middle" fill="#0f172a">
    <g fill="#99f6e4" stroke="#0f766e" stroke-width="1.5">
      <rect x="110" y="96" width="100" height="30" rx="7"/><rect x="110" y="146" width="100" height="30" rx="7"/><rect x="110" y="196" width="100" height="30" rx="7"/>
      <rect x="240" y="96" width="100" height="30" rx="7"/><rect x="240" y="146" width="100" height="30" rx="7"/><rect x="240" y="196" width="100" height="30" rx="7"/>
      <rect x="470" y="96" width="100" height="30" rx="7"/><rect x="470" y="146" width="100" height="30" rx="7"/><rect x="470" y="196" width="100" height="30" rx="7"/>
    </g>
    <text x="160" y="116">1×1 conv, 4</text><text x="160" y="166">3×3 conv, 4</text><text x="160" y="216">1×1 conv, 256</text>
    <text x="290" y="116">1×1 conv, 4</text><text x="290" y="166">3×3 conv, 4</text><text x="290" y="216">1×1 conv, 256</text>
    <text x="520" y="116">1×1 conv, 4</text><text x="520" y="166">3×3 conv, 4</text><text x="520" y="216">1×1 conv, 256</text>
  </g>
  <text x="405" y="166" font-size="24" font-weight="700" text-anchor="middle" fill="#64748b">…</text>

  <!-- Aggregate -->
  <circle cx="380" cy="262" r="14" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="380" y="268" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937">+</text>
  <text x="402" y="292" font-size="11" fill="#475569">sum the 32 paths</text>

  <!-- Residual add -->
  <circle cx="380" cy="340" r="14" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="380" y="346" font-size="18" font-weight="700" text-anchor="middle" fill="#1f2937">+</text>
  <text x="560" y="332" font-size="11" fill="#475569" text-anchor="middle">identity shortcut</text>

  <!-- Output -->
  <rect x="300" y="392" width="160" height="34" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="380" y="414" font-size="13" font-weight="600" text-anchor="middle" fill="#0f172a">output · 256 channels</text>

  <!-- Caption -->
  <text x="58" y="150" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="middle">cardinality</text>
  <text x="58" y="166" font-size="12" font-weight="600" fill="#6d28d9" text-anchor="middle">= 32</text>
  <text x="58" y="184" font-size="11" fill="#64748b" text-anchor="middle">parallel paths</text>
  <text x="380" y="452" font-size="11" fill="#64748b" text-anchor="middle">ResNeXt block (32 × 4d): split → transform → aggregate, plus a residual shortcut</text>
</svg>
