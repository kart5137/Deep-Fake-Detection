<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="820" height="260" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>CNN architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <pattern id="px" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#dbeafe"/>
      <path d="M10,0 V10 H0" fill="none" stroke="#93c5fd" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="820" height="260" rx="14" fill="#ffffff"/>

  <!-- Input frame -->
  <rect x="20" y="70" width="80" height="80" fill="url(#px)" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Conv 1: feature maps -->
  <g stroke="#0f766e" stroke-width="1.5">
    <rect x="140" y="55" width="44" height="110" fill="#99f6e4"/>
    <rect x="148" y="63" width="44" height="110" fill="#5eead4"/>
    <rect x="156" y="71" width="44" height="110" fill="#2dd4bf"/>
  </g>
  <!-- Pool 1 -->
  <g stroke="#b45309" stroke-width="1.5">
    <rect x="240" y="72" width="34" height="80" fill="#fde68a"/>
    <rect x="246" y="78" width="34" height="80" fill="#fcd34d"/>
    <rect x="252" y="84" width="34" height="80" fill="#fbbf24"/>
  </g>
  <!-- Conv 2 -->
  <g stroke="#0f766e" stroke-width="1.5">
    <rect x="330" y="70" width="24" height="80" fill="#99f6e4"/>
    <rect x="336" y="76" width="24" height="80" fill="#5eead4"/>
    <rect x="342" y="82" width="24" height="80" fill="#2dd4bf"/>
    <rect x="348" y="88" width="24" height="80" fill="#14b8a6"/>
  </g>
  <!-- Pool 2 -->
  <g stroke="#b45309" stroke-width="1.5">
    <rect x="426" y="84" width="18" height="54" fill="#fde68a"/>
    <rect x="431" y="89" width="18" height="54" fill="#fcd34d"/>
    <rect x="436" y="94" width="18" height="54" fill="#fbbf24"/>
    <rect x="441" y="99" width="18" height="54" fill="#f59e0b"/>
  </g>
  <!-- Flatten -->
  <g fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.2">
    <rect x="534" y="50" width="12" height="12"/><rect x="534" y="65" width="12" height="12"/>
    <rect x="534" y="80" width="12" height="12"/><rect x="534" y="95" width="12" height="12"/>
    <rect x="534" y="110" width="12" height="12"/><rect x="534" y="125" width="12" height="12"/>
    <rect x="534" y="140" width="12" height="12"/><rect x="534" y="155" width="12" height="12"/>
  </g>

  <!-- Dense connections -->
  <g stroke="#cbd5e1" stroke-width="1">
    <path d="M546,56 L632,66 M546,86 L632,66 M546,116 L632,102 M546,146 L632,138 M546,161 L632,156 M546,71 L632,84 M546,101 L632,120 M546,131 L632,102"/>
    <path d="M648,66 L728,96 M648,84 L728,96 M648,102 L728,96 M648,120 L728,128 M648,138 L728,128 M648,156 L728,128 M648,102 L728,128 M648,120 L728,96"/>
  </g>
  <!-- Fully connected -->
  <g fill="#fce7f3" stroke="#be185d" stroke-width="1.5">
    <circle cx="640" cy="66" r="8"/><circle cx="640" cy="84" r="8"/><circle cx="640" cy="102" r="8"/>
    <circle cx="640" cy="120" r="8"/><circle cx="640" cy="138" r="8"/><circle cx="640" cy="156" r="8"/>
  </g>
  <!-- Output -->
  <g stroke-width="2">
    <circle cx="740" cy="96" r="12" fill="#dcfce7" stroke="#15803d"/>
    <circle cx="740" cy="128" r="12" fill="#fee2e2" stroke="#b91c1c"/>
  </g>
  <g font-size="12" font-weight="600" fill="#0f172a">
    <text x="758" y="100">Real</text>
    <text x="758" y="132">Fake</text>
  </g>

  <!-- Flow arrows -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M104,110 H134" marker-end="url(#a)"/>
    <path d="M204,118 H234" marker-end="url(#a)"/>
    <path d="M290,118 H324" marker-end="url(#a)"/>
    <path d="M376,120 H420" marker-end="url(#a)"/>
    <path d="M463,120 H528" marker-end="url(#a)"/>
  </g>

  <!-- Labels -->
  <g font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">
    <text x="60" y="212">Input frame</text>
    <text x="170" y="212">Convolution</text>
    <text x="263" y="212">Pooling</text>
    <text x="351" y="212">Convolution</text>
    <text x="442" y="212">Pooling</text>
    <text x="540" y="212">Flatten</text>
    <text x="640" y="212">Fully connected</text>
    <text x="752" y="212">Output</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle">
    <text x="60" y="229">pixels</text>
    <text x="170" y="229">filters + ReLU</text>
    <text x="263" y="229">downsample</text>
    <text x="351" y="229">filters + ReLU</text>
    <text x="442" y="229">downsample</text>
    <text x="540" y="229">to a vector</text>
    <text x="640" y="229">combine features</text>
    <text x="752" y="229">class scores</text>
  </g>
</svg>
